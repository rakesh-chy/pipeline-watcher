[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-watcher"
version = "0.1.0"
description = "Self-hosted SLA monitor for batch data pipelines: heartbeats, freshness checks, Slack alerts, status page. Postgres-backed."
authors = [{ name = "Rakesh Chaudhary" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "psycopg[binary,pool]>=3.1.18",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
watcher = "watcher.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watcher = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() pattern intentionally uses a callable as a default argument.
"src/watcher/api.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
