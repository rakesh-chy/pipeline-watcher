services:
  postgres:
    image: postgres:16-alpine
    container_name: pipeline-watcher-pg
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher
      POSTGRES_DB: watcher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watcher -d watcher"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
